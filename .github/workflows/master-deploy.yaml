name: Build, Push, and Deploy Docker Image

on:
  push:
    branches:
      - master

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          registry: docker.io
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: docker.io/${{ secrets.DOCKER_HUB_USERNAME }}/web-admin
          tags: |
            type=sha,prefix=
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  deploy:
    runs-on: ubuntu-latest
    needs: build

    env:
      MANIFEST_PATH: k8s/manifest.yaml
      KUBECONFIG: /tmp/kubeconfig
      SESSION_KEY: ${{ vars.SESSION_KEY }}
      USERS_URL: ${{ vars.USERS_URL }}
      ANALYTICS_URL: ${{ vars.ANALYTICS_URL }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up kubectl
        uses: azure/setup-kubectl@v3

      - name: Prepare kubeconfig
        run: |
          mkdir -p "$(dirname "$KUBECONFIG")"
          echo "${{ secrets.KUBECONFIG_BASE64 }}" | base64 --decode > "$KUBECONFIG"
          chmod 600 "$KUBECONFIG"
          kubectl --kubeconfig "$KUBECONFIG" auth can-i get pods --all-namespaces

      - name: Create or update web-admin environment Secret
        env:
          REDIS_ADDR: ${{ vars.REDIS_ADDR }}
          REDIS_PASSWORD: ${{ vars.REDIS_PASSWORD }}
          SESSION_KEY: ${{ vars.SESSION_KEY }}
          USERS_URL: ${{ vars.USERS_URL }}
          ANALYTICS_URL: ${{ vars.ANALYTICS_URL }}
        run: |
          kubectl --kubeconfig "$KUBECONFIG" create secret generic web-admin-env \
            --from-literal=REDIS_ADDR="$REDIS_ADDR" \
            --from-literal=REDIS_PASSWORD="$REDIS_PASSWORD" \
            --from-literal=SESSION_KEY="$SESSION_KEY" \
            --from-literal=USERS_URL="$USERS_URL" \
            --from-literal=ANALYTICS_URL="$ANALYTICS_URL" \
            --dry-run=client -o yaml | kubectl --kubeconfig "$KUBECONFIG" apply -f -

      - name: Apply Manifest
        run: kubectl --kubeconfig "$KUBECONFIG" apply -f "$MANIFEST_PATH"

      - name: Set Docker image
        run: kubectl --kubeconfig "$KUBECONFIG" set image deployment/web-admin web-admin="docker.io/${{ secrets.DOCKER_HUB_USERNAME }}/web-admin:latest"

      - name: Restart Deployment
        run: kubectl --kubeconfig "$KUBECONFIG" rollout restart deployment/web-admin
