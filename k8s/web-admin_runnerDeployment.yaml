apiVersion: v1
kind: Namespace
metadata:
  name: github-runners
  labels:
    app.kubernetes.io/name: github-runners
    app.kubernetes.io/component: actions-runner
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: github-runner-sa
  namespace: github-runners
  labels:
    app.kubernetes.io/name: github-runners
    app.kubernetes.io/component: actions-runner
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: github-runner-role
  namespace: github-runners
  labels:
    app.kubernetes.io/name: github-runners
    app.kubernetes.io/component: actions-runner
rules:
  - apiGroups: [""]
    resources:
      - pods
      - pods/log
      - pods/status
      - events
    verbs:
      - get
      - list
      - watch
      - create
      - patch
      - update
      - delete
  - apiGroups: [""]
    resources:
      - pods/exec
    verbs:
      - create
  - apiGroups: [""]
    resources:
      - secrets
      - configmaps
    verbs:
      - get
      - list
      - watch
      - create
      - patch
      - update
      - delete
  - apiGroups: ["batch"]
    resources:
      - jobs
    verbs:
      - get
      - list
      - watch
      - create
      - patch
      - update
      - delete
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: github-runner-rolebinding
  namespace: github-runners
  labels:
    app.kubernetes.io/name: github-runners
    app.kubernetes.io/component: actions-runner
subjects:
  - kind: ServiceAccount
    name: github-runner-sa
    namespace: github-runners
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: github-runner-role
---
apiVersion: actions.summerwind.dev/v1alpha1
kind: RunnerDeployment
metadata:
  name: kotenkass-web-admin-runner
  namespace: github-runners
  labels:
    app.kubernetes.io/name: github-runners
    app.kubernetes.io/component: actions-runner
spec:
  replicas: 1
  template:
    spec:
      repository: Kotenkass/web-admin
      labels:
        - self-hosted
        - linux
        - k8s
        - web-admin
      serviceAccountName: github-runner-sa
      automountServiceAccountToken: true
      containerMode: kubernetes
      env:
        - name: KUBECONFIG
          value: /var/run/secrets/kubernetes.io/serviceaccount/kubeconfig
        - name: ACTIONS_RUNNER_REQUIRE_JOB_CONTAINER
          value: "false"
      securityContext:
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
      resources:
        requests:
          cpu: 100m
          memory: 128Mi
        limits:
          cpu: 1500m
          memory: 3Gi
      volumeMounts:
        - name: runner-kubeconfig
          mountPath: /var/run/secrets/kubernetes.io/serviceaccount
          readOnly: true
      volumes:
        - name: runner-kubeconfig
          projected:
            sources:
              - serviceAccountToken:
                  expirationSeconds: 86400
                  path: token
              - configMap:
                  name: kube-root-ca.crt
                  items:
                    - key: ca.crt
                      path: ca.crt
              - downwardAPI:
                  items:
                    - fieldRef:
                        apiVersion: v1
                        fieldPath: metadata.namespace
                      path: namespace
      workVolumeClaimTemplate:
        storageClassName: csi-cinder-classic
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 2Gi
